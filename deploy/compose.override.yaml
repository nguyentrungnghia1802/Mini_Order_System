# Optional native-debug override. The base Compose file keeps application ports private.
services:
  postgres:
    ports:
      - "${POSTGRES_DEBUG_PORT:-5432}:5432"
  rabbitmq:
    ports:
      - "5672:5672"
  web:
    ports:
      - "${WEB_DEBUG_PORT:-8080}:8080"
  gateway:
    ports:
      - "${GATEWAY_DEBUG_PORT:-8081}:8080"
  product-service:
    ports:
      - "${PRODUCT_DEBUG_PORT:-5245}:8080"
  order-service:
    ports:
      - "${ORDER_DEBUG_PORT:-5075}:8080"
  notification-service:
    ports:
      - "${NOTIFICATION_DEBUG_PORT:-5088}:8080"
