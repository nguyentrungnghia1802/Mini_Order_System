name: CI

on:
  push:
    branches: [main, "chore/**", "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET restore, format, build, test
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Restore
        run: dotnet restore MicroShop.sln

      - name: Verify formatting
        run: dotnet format MicroShop.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build MicroShop.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MicroShop.sln --configuration Release --no-build

  angular:
    name: Angular install, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/microshop-ui/package-lock.json

      - name: Install dependencies
        working-directory: web/microshop-ui
        run: npm ci

      - name: Lint
        working-directory: web/microshop-ui
        run: npm run lint

      - name: Test
        working-directory: web/microshop-ui
        run: npm run test -- --watch=false

      - name: Build
        working-directory: web/microshop-ui
        run: npm run build

  compose:
    name: Compose full-stack smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example -f deploy/compose.yaml config --quiet

      - name: Build and start the full stack
        run: docker compose --env-file .env.example -f deploy/compose.yaml up --build -d --wait

      - name: Show service status
        if: always()
        run: docker compose --env-file .env.example -f deploy/compose.yaml ps

      - name: Stop infrastructure without removing volumes
        if: always()
        run: docker compose --env-file .env.example -f deploy/compose.yaml down

  e2e:
    name: Compose Playwright E2E
    runs-on: ubuntu-latest
    env:
      CI: true
      MICROSHOP_E2E_BASE_URL: http://127.0.0.1:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/microshop-ui/package-lock.json

      - name: Install Angular and Playwright dependencies
        working-directory: web/microshop-ui
        run: npm ci

      - name: Install Chromium and Linux dependencies
        working-directory: web/microshop-ui
        run: npx playwright install --with-deps chromium

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example -f deploy/compose.yaml config --quiet

      - name: Start full Compose stack
        run: docker compose --env-file .env.example -f deploy/compose.yaml up --build -d --wait

      - name: Run Playwright E2E
        working-directory: web/microshop-ui
        run: npm run e2e

      - name: Show service status and logs
        if: always()
        run: |
          docker compose --env-file .env.example -f deploy/compose.yaml ps --all
          docker compose --env-file .env.example -f deploy/compose.yaml logs --no-color --tail=200 gateway order-service product-service notification-service

      - name: Stop Compose without removing volumes
        if: always()
        run: docker compose --env-file .env.example -f deploy/compose.yaml down --remove-orphans

  migrations:
    name: Product migration validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: microshop_product_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d microshop_product_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Restore
        run: dotnet restore MicroShop.sln

      - name: Install EF CLI
        shell: bash
        run: dotnet tool install --tool-path "$RUNNER_TEMP/dotnet-tools" dotnet-ef --version 10.0.10

      - name: Create Order migration database
        shell: bash
        run: >-
          psql -h localhost -U postgres -d microshop_product_ci
          -v ON_ERROR_STOP=1
          -c "CREATE DATABASE microshop_order_ci"

      - name: Apply Product migration to empty PostgreSQL database
        shell: bash
        env:
          PRODUCT_DB_HOST: localhost
          PRODUCT_DB_PORT: 5432
          PRODUCT_DB_NAME: microshop_product_ci
          PRODUCT_DB_USER: postgres
        run: >-
          "$RUNNER_TEMP/dotnet-tools/dotnet-ef" database update
          --project src/Services/ProductService/MicroShop.ProductService
          --startup-project src/Services/ProductService/MicroShop.ProductService

      - name: Apply Order migration to empty PostgreSQL database
        shell: bash
        env:
          ORDER_DB_HOST: localhost
          ORDER_DB_PORT: 5432
          ORDER_DB_NAME: microshop_order_ci
          ORDER_DB_USER: postgres
        run: >-
          "$RUNNER_TEMP/dotnet-tools/dotnet-ef" database update
          --project src/Services/OrderService/MicroShop.OrderService
          --startup-project src/Services/OrderService/MicroShop.OrderService

  repository-safety:
    name: Repository safety checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [[ -n "${tracked_env_files}" ]]; then
            echo "Tracked environment files are not allowed:"
            echo "${tracked_env_files}"
            exit 1
          fi

      - name: Scan for common credential formats
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E '(-----BEGIN [A-Z ]+PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,})' -- .; then
            echo "A credential-like value was found in tracked content."
            exit 1
          fi

      - name: Check whitespace errors
        run: git diff --check

  container-images:
    name: Container image build validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build all application images
        run: docker compose --env-file .env.example -f deploy/compose.yaml build --quiet
